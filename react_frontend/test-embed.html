<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homeveda Client Test Page</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #333;
        }
        .container {
            text-align: center;
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 600px;
        }
        h1 { color: #2563eb; }
        p { line-height: 1.6; color: #666; }
        .badge {
            background: #dbeafe;
            color: #1e40af;
            padding: 0.5rem 1rem;
            border-radius: 99px;
            font-size: 0.875rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="badge">Demo Customer Website</span>
        <h1>Welcome to Homeveda Store</h1>
        <p>This is a mock customer website to test the **Embeddable AI Chatbot Widget**.</p>
        <p>Look at the bottom-right corner of the screen. You should see a blue chat icon. Click it to start talking to our AI expert!</p>
    </div>

    <!-- The Chatbot Widget Script -->
    <script src="/dist/chatbot-widget.js" data-app-id="homeveda_shop"></script>
</body>
</html>
